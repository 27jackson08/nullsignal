# Publish the static build to GitHub Pages.
#
# Everything the site shows comes from the snapshot committed in data/raw, so
# this job never touches the network for data: it rebuilds the store, bakes the
# API to JSON, and ships the result. The published site is exactly what a local
# clone produces.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the engine
        run: uv pip install --system -e .

      - name: Build the store from the committed snapshot
        run: nullsignal build

      - name: Bake the API to static JSON
        run: nullsignal export

      - name: Build the site
        working-directory: web
        env:
          VITE_BASE: /nullsignal/
        run: |
          npm ci
          npm run build:static

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
