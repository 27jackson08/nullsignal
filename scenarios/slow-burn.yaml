name: slow-burn
description: >
  A three-day heat event compressed into one run, with no instrument fault at
  all. Everything works. The danger accumulates because heat does not need a
  failure to hurt people - it only needs to persist somewhere they cannot leave.

  The counterpart to every scenario in this suite: if the engine only reacts to
  broken feeds, it has learned the wrong lesson.

duration_hours: 18
tick_hours: 1

timeline:
  - at_hour: 0
    heat_index_f: 88
  - at_hour: 4
    heat_index_f: 93
  - at_hour: 8
    heat_index_f: 97
    note: sustained heat, no fault anywhere
  - at_hour: 10
    transit_disrupted: true
    note: an ordinary outage, honestly reported
  - at_hour: 15
    heat_index_f: 99
