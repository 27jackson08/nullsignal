name: partial-sensor-coverage
description: >
  The feed is perfectly healthy and simply stops speaking for everyone. Part of
  each tract goes unobserved - a depot loses power, a set of stops drops off the
  wire - while the remaining sensors report normally and truthfully.

  Nothing here is a lie. The coverage shrinks, the confidence should shrink with
  it, and an engine that reads the surviving sensors as speaking for the whole
  tract will be confidently wrong about the part that went dark.

duration_hours: 12
tick_hours: 1

timeline:
  - at_hour: 0
    heat_index_f: 88
  - at_hour: 4
    heat_index_f: 95
  - at_hour: 5
    inject: {source: gtfs_rt, mode: PARTIAL_COVERAGE, coverage: 0.2}
    note: four fifths of the transit network stops being observable
  - at_hour: 7
    transit_disrupted: true
